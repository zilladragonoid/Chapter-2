<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>JSON</h1>
    <script>
        var myobj={
            name: 'Sarah',
            age: 20,
            city: "New York"
        };
        var myjson=JSON.stringify(myobj);
        document.write(myjson);
        var myobj2=JSON.parse(myjson);
        document.write(myobj2)
        document.write(myobj2.age);
        document.write(myobj2.city);
    </script>
</body>
</html>
