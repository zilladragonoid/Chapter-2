</head>
<body>
    <h1>Defining variables</h1>
    <script>
        var a=10.2;
        var b=20;
        var c=20;
        var d=null;
        var e;
        document.write('a is equal to b: ' + (a == b) + '<br>');
        document.write('b is equal to c: ' + (b == c) + '<br>');
        document.write('d is equal to d: ' + (d == d) + '<br>');
        document.write('e is not undefined: ' + e + '<br>');
    </script>
</body>
